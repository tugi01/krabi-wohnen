name: Inserate aktualisieren & veröffentlichen

on:
  schedule:
    - cron: "0 23 * * *"   # täglich 06:00 Uhr Thailand
    - cron: "0 11 * * *"   # zusätzlich 18:00 Uhr Thailand
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inserate laden
        if: github.event_name != 'push'
        run: python3 scraper/scrape.py
        env:
          DETAIL_BUDGET: "1200"   # max. neue Detailseiten pro Lauf; Rest im nächsten Lauf
      - name: Daten speichern
        if: github.event_name != 'push'
        run: |
          git config user.name "krabi-wohnen-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data scraper/cache-*.json scraper/pois-*.json
          git diff --cached --quiet || git commit -m "Inserate aktualisiert $(date -u +%F\ %H:%M)"
          git pull --rebase -q || true
          git push
      - name: Ganz-Thailand-Daten dazulegen (liegen im Release, nicht im Repo)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if gh release download th-data -p th-data.tar.gz -D /tmp; then
            tar -xzf /tmp/th-data.tar.gz -C site/data && test -f site/data/th/index.json && echo '{"ready":true}' > site/data/th-status.json
          fi
      - name: Versionsnummer in Dateinamen (verhindert alte Versionen im Handy-Speicher)
        run: sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Kurz warten (GitHub braucht Zeit, bis das Paket sichtbar ist)
        run: sleep 20
      - id: deploy
        uses: actions/deploy-pages@v4
