<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2b33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Thailand Wohnen">
<meta name="robots" content="noindex">
<title>Thailand Wohnen</title>
<link rel="manifest" href="manifest.webmanifest?v=__BUILD__">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css?v=__BUILD__">
<link rel="stylesheet" href="style.css?v=__BUILD__">
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="cityseg" role="group" aria-label="Stadt wählen">
      <button data-city="thailand" aria-pressed="true">Thailand</button><button data-city="krabi" aria-pressed="false">Krabi</button><button data-city="pattaya" aria-pressed="false">Pattaya</button>
    </div>
    <p id="stand" class="muted">Lade Inserate …</p>
  </div>
  <div class="topbtns"><button id="shareApp" class="pill icon" aria-label="App teilen" title="App teilen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M6 11H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-1"/></svg></button>
  <button id="filterBtn" class="pill" aria-haspopup="dialog" aria-controls="filters">Filter <span id="filterCount"></span></button></div>
</header>

<nav class="seg" role="tablist" aria-label="Ansicht">
  <button role="tab" id="tabList" aria-selected="true" data-view="list">Liste</button>
  <button role="tab" id="tabMap" aria-selected="false" data-view="map">Karte</button>
  <button role="tab" id="tabFav" aria-selected="false" data-view="fav">★ Merken</button>
  <button role="tab" id="tabInfo" aria-selected="false" data-view="info">Infos</button>
</nav>

<main>
  <section id="viewList" class="view">
    <div id="sortbar" class="sortbar" role="group" aria-label="Sortieren">
      <button data-sort="price">Preis ↑ günstig zuerst</button>
      <button data-sort="sqm">฿ pro m²</button>
      <button data-sort="new">Neueste</button>
      <button data-sort="size">Größte</button>
      <button data-sort="beach">Nähe Strand</button>
      <button data-sort="mosque">Nähe Moschee</button>
      <button data-sort="gym">Nähe Muay Thai</button>
      <button data-sort="seven">Nähe 7-Eleven</button>
      <button data-sort="market">Nähe Nachtmarkt</button>
    </div>
    <div class="extbar">
      <button id="fbSearch" class="ext fb" type="button"><b>f</b> Auf Facebook Marketplace suchen ↗</button>
      <button id="ownAdd" class="ext" type="button">＋ Eigenes Inserat</button>
    </div>
    <p id="summary" class="summary"></p>
    <div id="list" class="cards"></div>
  </section>
  <section id="viewMap" class="view" hidden>
    <div id="map" aria-label="Karte der Inserate"></div>
    <p id="mapHint" class="maphint" aria-live="polite"></p>
    <div class="legend"><span class="dot l"></span>Wohnung (Preis) · Oben rechts Orte ein- und ausblenden · blasse Strände nur per Boot</div>
  </section>
  <section id="viewInfo" class="view" hidden><div id="info"></div></section>
</main>

<div id="scrim" class="scrim" hidden></div>
<aside id="filters" class="sheet" role="dialog" aria-modal="true" aria-labelledby="fTitle" hidden>
  <div class="grab"></div>
  <h2 id="fTitle">Filter</h2>
  <label class="row toggle"><span><b>Ältere Gebäude zeigen</b><small id="oldSub">älter als die Altersgrenze und nicht kernsaniert</small></span><input type="checkbox" id="fOld"><i></i></label>
  <div class="row"><label for="fAge"><b>Altersgrenze</b><small>Gebäude zählt als „jung“, wenn es jünger oder kernsaniert ist</small></label>
    <select id="fAge"><option value="3">3 Jahre</option><option value="5">5 Jahre</option><option value="7">7 Jahre</option><option value="10">10 Jahre</option><option value="15">15 Jahre</option></select></div>
  <label class="row toggle"><span><b>Nur mit Pool</b><small>privat oder Gemeinschaftspool</small></span><input type="checkbox" id="fPool"><i></i></label>
  <label class="row toggle"><span><b>Baujahr unbekannt zeigen</b><small>Inserat nennt kein Baujahr</small></span><input type="checkbox" id="fUnknown"><i></i></label>
  <label class="row toggle"><span><b>Ohne m²-Angabe zeigen</b><small>Inserat nennt keine Wohnfläche</small></span><input type="checkbox" id="fSizeUnknown"><i></i></label>
  <label class="row toggle"><span><b>Nur direkt vom Eigentümer</b><small>ohne Makler (wo das Inserat es angibt)</small></span><input type="checkbox" id="fOwner"><i></i></label>
  <label class="row toggle"><span><b>Nur sofort/bald frei</b><small>blendet „frei ab“ später als 2 Monate aus</small></span><input type="checkbox" id="fSoon"><i></i></label>
  <div class="row range"><label for="fSize"><b>Wohnfläche ab</b> <output id="oSize"></output></label><input type="range" id="fSize" min="0" max="200" step="5"></div>
  <div class="row range"><label for="fSizeMax"><b>Wohnfläche bis</b> <output id="oSizeMax"></output></label><input type="range" id="fSizeMax" min="40" max="400" step="10"></div>
  <div class="row range"><label for="fPrice"><b>Miete bis</b> <output id="oPrice"></output></label><input type="range" id="fPrice" min="10000" max="150000" step="1000"></div>
  <div class="row range"><label for="fBeach"><b>Strand max.</b> <output id="oBeach"></output></label><input type="range" id="fBeach" min="2" max="30" step="1"></div>
  <div class="row"><label for="fSort"><b>Sortierung</b></label>
    <select id="fSort">
      <option value="price">Preis aufsteigend</option>
      <option value="priceDesc">Preis absteigend</option>
      <option value="sqm">Preis pro m²</option>
      <option value="new">Neueste Inserate</option>
      <option value="beach">Nähe Strand</option>
      <option value="mosque">Nähe Moschee</option>
      <option value="gym">Nähe Muay Thai</option>
      <option value="seven">Nähe 7-Eleven</option>
      <option value="market">Nähe Nacht-/Essensmarkt</option>
      <option value="size">Größte zuerst</option>
    </select>
  </div>
  <div class="sheetActions"><button id="fReset" class="ghost">Zurücksetzen</button><button id="fClose" class="primary">Fertig</button></div>
</aside>

<aside id="detail" class="sheet detail" role="dialog" aria-modal="true" aria-labelledby="dTitle" hidden></aside>

<aside id="own" class="sheet" role="dialog" aria-modal="true" aria-labelledby="ownTitle" hidden>
  <div class="grab"></div>
  <h2 id="ownTitle">Eigenes Inserat hinzufügen</h2>
  <p class="muted small">Zum Beispiel von Facebook Marketplace. Wird nur auf diesem Gerät gespeichert. Danach tippst du den Ort auf der Karte an.</p>
  <form id="ownForm" class="ownform">
    <input type="hidden" id="wId">
    <label>Link zum Inserat<div class="pastewrap"><input id="wUrl" type="url" inputmode="url" placeholder="https://www.facebook.com/marketplace/item/…"><button type="button" id="ownPaste" class="ghost">Einfügen</button></div></label>
    <label>Titel<input id="wTitle" type="text" placeholder="z. B. Haus 2 SZ in Nong Thale" maxlength="120"></label>
    <div class="two"><label>Miete ฿ / Monat<input id="wPrice" type="number" inputmode="numeric" min="0" step="1" required></label>
      <label>Wohnfläche m²<input id="wSize" type="number" inputmode="numeric" min="0"></label></div>
    <div class="two"><label>Schlafzimmer<input id="wBeds" type="number" inputmode="numeric" min="0" max="10"></label>
      <label>Baujahr<input id="wBuilt" type="number" inputmode="numeric" min="1950" max="2035" placeholder="z. B. 2023"></label></div>
    <label>Pool<select id="wPool"><option value="">kein Pool</option><option value="gemeinschaft">Gemeinschaftspool</option><option value="privat">privater Pool</option></select></label>
    <label>Notiz<textarea id="wNote" rows="3" maxlength="1500" placeholder="Kontakt, Kaution, Besonderheiten …"></textarea></label>
    <div class="sheetActions"><button type="button" id="ownCancel" class="ghost">Abbrechen</button><button type="submit" class="primary">Speichern</button></div>
  </form>
</aside>

<script src="vendor/leaflet/leaflet.js?v=__BUILD__"></script>
<script src="th.js?v=__BUILD__"></script>
<script src="app.js?v=__BUILD__"></script>
</body>
</html>
